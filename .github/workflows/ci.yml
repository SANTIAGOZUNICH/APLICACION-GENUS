name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Tipos de PRODUCCIÓN (tsconfig.ci.json excluye los *.test.ts[x]). `tsc` con el tsconfig completo hoy arrastra
      # errores de tipos previos solo en archivos de prueba, por eso no se usa acá.
      - run: npx tsc --noEmit -p tsconfig.ci.json
      - run: npx vitest run
      # `npm run lint` NO se ejecuta: el baseline del repo tiene errores/advertencias previos (ver frontend/AGENTS.md).
      # Sumarlo cuando el baseline quede limpio. Tampoco corre `next build` ni E2E con Postgres.
